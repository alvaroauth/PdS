services:
 db:
   image: postgres:16
   ports:
     - "5432:5432"
   environment:
     POSTGRES_USER: user
     POSTGRES_PASSWORD: pass
     POSTGRES_DB: proyecto
   volumes:
     - ./volumes/local_pgdata:/var/lib/postgresql/data
 pgadmin:
   image: dpage/pgadmin4:9.7.0
   ports:
     - "5050:80"
   environment:
     PGADMIN_DEFAULT_EMAIL: admin@admin.com
     PGADMIN_DEFAULT_PASSWORD: pass
   links:
     - db